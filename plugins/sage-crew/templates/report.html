<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>
__TITLE__
</title>
<style>
:root {
  --rr-bg: #ffffff;
  --rr-fg: #1a1a1a;
  --rr-muted: #595959;
  --rr-border: #e0e0e0;
  --rr-accent: #2a6f5e;
  --rr-card-bg: #f7f7f7;
}

@media (prefers-color-scheme: dark) {
  :root {
    --rr-bg: #14161a;
    --rr-fg: #e8e8e8;
    --rr-muted: #a0a0a0;
    --rr-border: #2c2f36;
    --rr-accent: #6fd8b8;
    --rr-card-bg: #1c1f26;
  }
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
}

body {
  background: var(--rr-bg);
  color: var(--rr-fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

main.report {
  max-width: 720px;
  margin: 0 auto;
  padding: 24px 16px;
}

h1 {
  font-size: 1.5rem;
  margin: 0 0 4px 0;
  word-wrap: break-word;
}

h2 {
  font-size: 1.15rem;
  margin: 24px 0 8px 0;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--rr-border);
  word-wrap: break-word;
}

p.meta {
  margin: 0 0 24px 0;
  color: var(--rr-muted);
  font-size: 0.85rem;
}

p {
  margin: 0 0 12px 0;
  word-wrap: break-word;
}

ul {
  margin: 0 0 16px 0;
  padding-left: 20px;
}

li {
  margin: 0 0 6px 0;
  word-wrap: break-word;
}

a {
  color: var(--rr-accent);
}

.content {
  padding: 16px;
  background: var(--rr-card-bg);
  border: 1px solid var(--rr-border);
  border-radius: 8px;
}

.content > *:last-child {
  margin-bottom: 0;
}

@media (min-width: 720px) {
  main.report {
    padding: 40px 24px;
  }
}
</style>
</head>
<body>
<main class="report">
<h1>
__TITLE__
</h1>
<p class="meta">
__GENERATED_AT__
</p>
<div class="content">
__BODY__
</div>
</main>
</body>
</html>
